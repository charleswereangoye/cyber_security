<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Restricted Access</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            border: 1px solid #334155;
        }
        .badge {
            display: inline-block;
            background-color: #ef4444;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #f8fafc;
        }
        p {
            color: #94a3b8;
            line-height: 1.6;
        }
        .secret-box {
            background-color: #0f172a;
            border-left: 4px solid #38bdf8;
            padding: 1rem;
            margin-top: 1.5rem;
            border-radius: 4px;
            font-family: monospace;
            color: #38bdf8;
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Restricted Area</span>
        <h1>Admin Control Panel</h1>
        <p>Welcome, Administrator. Unauthorized access to this directory is strictly prohibited and logged.</p>
        
        <div class="secret-box">
            STATUS: SYSTEM ACTIVE<br>
            CONFIDENTIAL NOTE: Flag{robots_txt_recon_success}
        </div>

        <div class="footer">
            Offensive Lab Environment &bull; Internal Use Only
        </div>
    </div>
    <!-- Recon Hint: Directory listing or robots.txt leakage led you here! -->
</body>
</html>
